[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wonyotti-fr"
version = "0.1.0"
description = "Reproducible trade reconstruction and offline strategy research"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.1,<3",
  "pyarrow>=19,<25",
  "httpx>=0.28,<0.29",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
]

[project.scripts]
wonyotti = "wonyotti_fr.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/wonyotti_fr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
